# docker-compose.local.yml
# Local development stack only.
# Production deployments should use docker-compose.prod.yml or cloud-native config.
# Bind mounts + hot reload; not for servers.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: targetthisrole
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    env_file:
      - ../../apps/api/.env.development.local
      - ../../.env.dreamhost
    environment:
      NODE_ENV: development
      TYPEORM_SYNCHRONIZE: "true"
      ENABLE_LLM_PARITY_SCORE: "true"
      OPENAI_FIT_SCORE_MODEL: "gpt-4.1-mini"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
    command: sh -c "npm install --no-audit --no-fund && npm run start:dev"
    volumes:
      - ../../apps/api:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "3001:3001"
    depends_on:
      - db

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    restart: unless-stopped
    env_file:
      - ../../apps/web/.env.local
    environment:
      NEXT_PUBLIC_JOURNEY_NAV_V1_ENABLED: "true"
      NODE_ENV: development
      NEXT_PUBLIC_BETA_FORCE_PRO: "false"
      BETA_FORCE_PRO: "true"
    command: sh -c "npm install --include=optional --no-audit --no-fund && npm run dev -- --hostname 0.0.0.0 --port 3000"
    volumes:
      - ../../apps/web:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  db_data: {}
