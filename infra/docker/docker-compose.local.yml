# docker-compose.local.yml
# Local development stack only.
# Production deployments should use docker-compose.prod.yml or cloud-native config.
# Bind mounts + hot reload; not for servers.

services:
  db:
    # pgvector extension is required for API embeddings (vector column type).
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: targetthisrole
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    env_file:
      - ../../apps/api/.env.development.local
      - ../../.env.dreamhost
    environment:
      NODE_ENV: development
      TYPEORM_SYNCHRONIZE: "true"
      ENABLE_LLM_PARITY_SCORE: "true"
      APP_PUBLIC_WEB_URL: ${APP_PUBLIC_WEB_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-dev-local-super-long-random-string}
      REQUIRE_ACCESS_CODE: ${REQUIRE_ACCESS_CODE:-true}
    command: sh -c "npm install --no-audit --no-fund && npm run start:dev"
    volumes:
      - ../../apps/api:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "3001:3001"
    depends_on:
      - db

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    env_file:
      - ../../apps/web/.env.local
    environment:
      NEXT_PUBLIC_JOURNEY_NAV_V1_ENABLED: "true"
      NODE_ENV: development
      API_BASE_URL: http://api:3001
      NEXT_PUBLIC_BETA_FORCE_PRO: "false"
      BETA_FORCE_PRO: "true"
      BROWSERSLIST_IGNORE_OLD_DATA: "1"
      BASELINE_BROWSER_MAPPING_IGNORE_OLD_DATA: "1"
      TTR_SILENCE_BASELINE_BROWSER_MAPPING_WARNING: "1"
    command: sh -c "npm install --include=optional --no-audit --no-fund && npm run dev -- --hostname 0.0.0.0 --port 3000"
    volumes:
      - ../../apps/web:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  db_data: {}
