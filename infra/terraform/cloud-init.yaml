#cloud-config
package_update: true
package_upgrade: false

packages:
  - ca-certificates
  - curl
  - gnupg
  - lsb-release

runcmd:
  # --- install docker ---
  - curl -fsSL https://get.docker.com | sh
  - systemctl enable docker
  - systemctl start docker

  # --- add swap (2G) ---
  - fallocate -l 2G /swapfile
  - chmod 600 /swapfile
  - mkswap /swapfile
  - swapon /swapfile
  - grep -q '^/swapfile' /etc/fstab || echo '/swapfile none swap sw 0 0' >> /etc/fstab

  # --- app directory ---
  - mkdir -p /opt/targetthisrole
  - chmod 755 /opt/targetthisrole

  # --- recovery script ---
  - |
    cat >/opt/targetthisrole/up.sh <<'EOF'
    #!/usr/bin/env bash
    set -euo pipefail
    cd /opt/targetthisrole
    GIT_SHA="$(awk -F= '/^GIT_SHA=/{print $2; exit}' .env)"
    if [[ -z "${GIT_SHA}" || "${GIT_SHA}" == "unknown" ]]; then
      echo "ERROR: production build identity unavailable. The deployed web bundle must provide a real commit SHA." >&2
      exit 1
    fi
    echo "Deploy preflight:"
    echo "  - canonical deploy script path: /opt/targetthisrole/up.sh"
    echo "  - compose file path: /opt/targetthisrole/docker-compose.yml"
    echo "  - env file path: /opt/targetthisrole/.env"
    echo "  - GIT_SHA present: yes"
    echo "  - build arg GIT_SHA=${GIT_SHA}"
    docker compose --env-file .env -f docker-compose.yml pull
    docker compose --env-file .env -f docker-compose.yml up -d
    EOF
  - chmod +x /opt/targetthisrole/up.sh
  # --- placeholder files for Terraform provisioners ---
  - touch /opt/targetthisrole/.env
  - touch /opt/targetthisrole/docker-compose.yml
  - chmod 600 /opt/targetthisrole/.env
  - chmod 644 /opt/targetthisrole/docker-compose.yml
