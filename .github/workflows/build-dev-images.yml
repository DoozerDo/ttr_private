name: Build and push dev images

on:
  push:
    branches:
      - develop
      - salvage-cover-baseline

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: web
            dockerfile: infra/docker/web.Dockerfile
          - name: api
            dockerfile: infra/docker/api.Dockerfile
          - name: proxy
            dockerfile: infra/docker/proxy.Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || github.token }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/targetthisrole/targetthisrole-${{ matrix.name }}:dev
            ghcr.io/targetthisrole/targetthisrole-${{ matrix.name }}:${{ github.sha }}
