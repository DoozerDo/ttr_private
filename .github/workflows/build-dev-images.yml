# apps\web\app\api\admin\users\route.ts
name: Build and push dev images

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - accesscode_waiting

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GIT_SHA: ${{ github.sha }}
    strategy:
      matrix:
        include:
          - name: web
            dockerfile: apps/web/Dockerfile
          - name: api
            dockerfile: infra/docker/api.Dockerfile
          - name: proxy
            dockerfile: infra/docker/proxy.Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Run synthetic generation gate
        run: npm run validate:synthetic

      - name: Preflight web build identity
        if: matrix.name == 'web'
        run: |
          set -euo pipefail
          if [ -z "${GIT_SHA:-}" ] || [ "${GIT_SHA}" = "unknown" ]; then
            echo "ERROR: production build identity unavailable. The deployed web bundle must provide a real commit SHA." >&2
            exit 1
          fi
          echo "Deploy preflight:"
          echo "  - canonical build entrypoint: docker/build-push-action@v5"
          echo "  - Dockerfile path: ${{ matrix.dockerfile }}"
          echo "  - GIT_SHA present: yes"
          echo "  - build arg GIT_SHA=${GIT_SHA}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || github.token }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            GIT_SHA=${{ env.GIT_SHA }}
          push: true
          tags: |
            ghcr.io/doozerdo/ttr_private-${{ matrix.name }}:dev
            ghcr.io/doozerdo/ttr_private-${{ matrix.name }}:${{ github.sha }}
