name: Synthetic landing

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - "*"

jobs:
  synthetic-landing:
    name: Landing synthetic transaction suite
    runs-on: ubuntu-latest
    env:
      SYNTHETIC_INGEST_TOKEN: synthetic-ingest-local
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Build web app
        run: npm -w apps/web run build

      - name: Start Docker dev stack
        run: docker compose -f infra/docker/docker-compose.dev.yml up --build -d

      - name: Wait for API readiness
        run: |
          set -euo pipefail
          max_attempts=12
          attempt=0
          until curl -fsS http://localhost:3001/status >/dev/null; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "API did not become ready after $((max_attempts * 5)) seconds" >&2
              exit 1
            fi
            echo "Waiting for API (attempt $attempt/$max_attempts)..."
            sleep 5
          done

      - name: Run auth synthetic suite
        run: npm run synthetic:auth
