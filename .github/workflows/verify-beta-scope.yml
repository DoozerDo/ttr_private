name: Verify Beta Scope

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Run synthetic generation gate
        run: npm run validate:synthetic

      - name: Run web trust gate
        run: npm run test:trust:web

      - name: Run beta verification
        run: npm run verify:ci:core

      - name: Studio release contract (golden path)
        run: npm -w apps/web test -- workflow-journey-scenarios.test.tsx --runInBand

      - name: Studio suite
        run: npm -w apps/web test -- studio --runInBand
