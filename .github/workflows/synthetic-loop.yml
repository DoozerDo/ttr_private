name: Synthetic loop

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - '*'

jobs:
  synthetic-loop:
    name: Synthetic loop suite
    runs-on: ubuntu-latest
    env:
      GIT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Preflight web build identity
        run: |
          set -euo pipefail
          if [ -z "${GIT_SHA:-}" ] || [ "${GIT_SHA}" = "unknown" ]; then
            echo "ERROR: production build identity unavailable. The deployed web bundle must provide a real commit SHA." >&2
            exit 1
          fi
          echo "Deploy preflight:"
          echo "  - canonical build entrypoint: docker compose -f infra/docker/docker-compose.dev.yml up --build -d"
          echo "  - compose file path: infra/docker/docker-compose.dev.yml"
          echo "  - env file path: apps/api/.env.development.local"
          echo "  - GIT_SHA present: yes"
          echo "  - build arg GIT_SHA=${GIT_SHA}"

      - name: Prepare CI API env file
        run: |
          # docker-compose.dev.yml expects this local-only file to exist.
          # In CI we create a safe, non-secret placeholder so the stack can start on fresh runners.
          mkdir -p apps/api
          cat > apps/api/.env.development.local <<'EOF'
          # CI placeholder env. Do NOT put secrets here.
          # Compose provides required runtime vars via `environment:` defaults.
          OPENAI_API_KEY=
          SENTRY_DSN=
          EOF

      - name: Start Docker dev stack
        run: docker compose -f infra/docker/docker-compose.dev.yml up --build -d

      - name: Wait for API readiness
        run: |
          set -euo pipefail
          max_attempts=12
          attempt=0
          until curl -fsS http://localhost:3001/status >/dev/null; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "API did not become ready after $((max_attempts * 5)) seconds" >&2
              exit 1
            fi
            echo "Waiting for API (attempt $attempt/$max_attempts)..."
            sleep 5
          done

      - name: Run synthetic loop
        run: npm run synthetic:loop
